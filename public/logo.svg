<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="dj-cube-top" x1="60" y1="18" x2="60" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="dj-cube-left" x1="26" y1="52" x2="60" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="dj-cube-right" x1="60" y1="52" x2="94" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="dj-drip-glow" x1="60" y1="78" x2="60" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="dj-glow" x="40" y="70" width="40" height="45" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded subtle container -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="#020617" stroke="#1e293b" stroke-width="2" />
  
  <!-- Isometric Minecraft Cube -->
  <!-- Top Face -->
  <polygon points="60,20 92,38 60,54 28,38" fill="url(#dj-cube-top)" stroke="#a7f3d0" stroke-width="1.5" stroke-linejoin="round" />
  
  <!-- Inset pixel pattern on top face -->
  <polygon points="60,28 78,38 60,47 42,38" fill="#a7f3d0" fill-opacity="0.3" />

  <!-- Left Face -->
  <polygon points="28,38 60,54 60,86 28,70" fill="url(#dj-cube-left)" stroke="#10b981" stroke-width="1.5" stroke-linejoin="round" />
  
  <!-- Right Face -->
  <polygon points="60,54 92,38 92,70 60,86" fill="url(#dj-cube-right)" stroke="#047857" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Pixel accent in center -->
  <rect x="55" y="47" width="10" height="10" transform="rotate(45 60 52)" fill="#ffffff" fill-opacity="0.8" />

  <!-- The "Drip" Droplet hanging & falling from bottom vertex (x=60, y=86) -->
  <path d="M60,82 C55,88 50,96 50,102 C50,107.5 54.5,111 60,111 C65.5,111 70,107.5 70,102 C70,96 65,88 60,82 Z" 
        fill="url(#dj-drip-glow)" 
        filter="url(#dj-glow)"
        stroke="#ffffff"
        stroke-width="1.2" />

  <!-- Droplet shine reflection -->
  <ellipse cx="56.5" cy="99" rx="2" ry="4" transform="rotate(-20 56.5 99)" fill="#ffffff" fill-opacity="0.9" />
</svg>
